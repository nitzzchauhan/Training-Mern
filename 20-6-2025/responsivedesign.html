responisve breakpoints


what are the breakpoints?

breakpoints are screenwidth where layout changes to adapt to a device. these are impleted using media query.



xs -> max-width 576px
s -> > 576px
m -> > 768px
l -> > 992px
xl -> > 1200px


Media Queries

media queries allow you to apply css styles only when certain conditions are true.


@media (condition){
 cssrules 
}



















-->
<div class="container">

</div>


<style>
  


    /* tablet and up */
   @media screen and (min-width: 992px) {
     /* CSS rules go here */
     body{
        background: black;
        color: aliceblue;
     }
}

@media screen and (min-width: 1200px) {
     /* CSS rules go here */

       color: black;

    }
}
