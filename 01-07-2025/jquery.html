    <!-- question 8 -->
     <style>
        .slider img {display: none; width: 300px;}
        .slider img:first-child {
            display: block;
        }
     </style>

    <div class="slider">
      <img
        src="https://th.bing.com/th?id=ORMS.c44f57607478a1e679fe05691cc2a06e&pid=Wdp&w=268&h=140&qlt=90&c=1&rs=1&dpr=1&p=0"
        alt=""
      />
      <img
        src="https://th.bing.com/th?id=ORMS.602dcdbdb2224219b8ac34e86f193ec5&pid=Wdp&w=612&h=304&qlt=90&c=1&rs=1&dpr=1.375&p=0"
        alt=""
      />
      <img
        src="https://th.bing.com/th?id=ORMS.d5d16b4cff537605b1cd955ad7ae8058&pid=Wdp&w=612&h=304&qlt=90&c=1&rs=1&dpr=1.375&p=0"
        alt=""
      />
    </div>
    <button id="next">Next</button>
    <button id="previous">Previous</button>
<!-- 1%3 = 1
2%3 = 2
3%3 = 0 -->


    <script>
        let index = 0;
        const images = $(".slider img")
        // console.log(images.length)
        // console.log(images.eq(2))

        function showImage(i){
            images.hide()
            images.eq(i).show()
        }

         $("#next").click(function(){
            index += 1
            if (index > 2){
                index=0
            }
            showImage(index)
         })
         $("#previous").click(function(){
            index -= 1
            if (index < 0){
                index = 2
            }
            showImage(index)
         })

         setInterval(()=>{
            console.log("i am set interval")
         },1000)
    </script>
