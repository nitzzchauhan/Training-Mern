<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Dashboard</title>
    <link rel="stylesheet" href="travel.css" />
  </head>
  <body>
    <!-- header section -->
    <header>
      <h1>Explore the World</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Destination</a></li>
          <li><a href="#">Bookings</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <center>
      <!-- filter section -->
      <section class="filters">
        <form>
          <label for="region">Choose a Reason</label>
          <select name="" id="region">
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="America">America</option>
          </select>
        </form>
      </section>
    </center>

    <!-- destination cards -->
    <center>
      <section class="destination-list">
        <article class="card">
          <img
            src="https://images.pexels.com/photos/29326393/pexels-photo-29326393.jpeg"
            alt=""
            width="100"
            height="100"
          />
          <h2>Bali Beach</h2>
          <p>$300/person</p>
        </article>
        <article class="card">
          <img
            src="https://images.pexels.com/photos/618833/pexels-photo-618833.jpeg"
            alt=""
            width="100"
            height="100"
          />
          <h2>Himalaya Mountains</h2>
          <p>$500/person</p>
        </article>
      </section>
    </center>

    <!-- <center> -->
      <!--    Booking Form -->
      <section class="booking-form">
        <h2>Book Your Trip</h2>
        <form>
          <label for="name">Name:</label>
          <input
            type="text"
            name=""
            id="name"
            placeholder="Enter Your Name"
            required
          />
          <label for="email">Email:</label>
          <input
            type="email"
            name=""
            id="Email"
            placeholder="Enter Your Email"
            required
          />
          <label for="date">Date:</label>
          <input
            type="date"
            name=""
            id="date"
            placeholder="Enter Your Name"
            required
          />
          <button type="submit">Book Now</button>
        </form>
      </section>
    <!-- </center> -->
    <!-- footer -->
    <footer>
      <center>
        <p>&copy; 2025 Travel Dashboard. All rights Reserved.</p>
      </center>
    </footer>
  </body>
</html>
